<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>eOfficeGate</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    width: 340px;
    padding: 12px;
    margin: 0;
    color: #1e293b;
    background: #ffffff;
    box-sizing: border-box;
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  h3 { margin: 0; font-size: 15px; font-weight: 700; color: #0f172a; }
  .badge {
    font-size: 10px; font-weight: 600; padding: 2px 6px;
    border-radius: 9999px; background: #e0f2fe; color: #0369a1;
  }
  .subtitle { font-size: 11px; color: #64748b; margin: 0 0 8px; }
  
  /* Update Banner */
  .update-banner {
    background: linear-gradient(135deg, #0284c7, #1d4ed8);
    color: #fff;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
    box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
  }
  .update-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; }
  .update-title { font-weight: 600; }
  .update-actions { display: flex; gap: 6px; }
  .btn-update-now {
    background: #fff;
    color: #0284c7;
    font-weight: 700;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    flex: 1;
  }
  .btn-update-now:hover { background: #f0f9ff; }
  .btn-changelog {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    text-decoration: none;
    cursor: pointer;
    text-align: center;
  }
  .btn-changelog:hover { background: rgba(255, 255, 255, 0.3); }
  .update-progress {
    margin-top: 6px;
    padding: 4px 6px;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 4px;
    font-size: 10px;
    line-height: 1.3;
  }

  .card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .card-title { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 6px; letter-spacing: 0.5px; }

  .row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; font-size: 12px; }
  .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  select { width: 105px; padding: 3px 5px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 11px; background: #fff; }
  
  .btn-group { display: flex; gap: 6px; margin: 8px 0 6px; }
  button {
    padding: 7px 9px;
    font-size: 11px;
    font-weight: 600;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button#toggle { flex: 1.8; color: #fff; }
  button#toggle.start { background: #16a34a; }
  button#toggle.start:hover { background: #15803d; }
  button#toggle.stop { background: #dc2626; }
  button#toggle.stop:hover { background: #b91c1c; }
  
  button#testPing { flex: 1.4; background: #0284c7; color: #fff; }
  button#testPing:hover { background: #0369a1; }
  button#testPing:disabled { background: #94a3b8; cursor: not-allowed; }

  .status-box {
    font-size: 11px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 7px 9px;
    line-height: 1.45;
  }
  .status-line { margin: 2px 0; display: flex; align-items: flex-start; gap: 6px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .dot.ok { background: #16a34a; }
  .dot.warn { background: #ea580c; }
  .dot.err { background: #dc2626; }
  .dot.idle { background: #94a3b8; }
  
  .test-result {
    margin-top: 6px;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }
  .test-result.success { background: #dcfce7; color: #166534; }
  .test-result.error { background: #fee2e2; color: #991b1b; }

  /* Logs Section */
  .logs-section {
    margin-top: 8px;
    background: #0f172a;
    border-radius: 6px;
    padding: 8px;
    color: #e2e8f0;
  }
  .logs-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .logs-actions button {
    background: transparent;
    color: #38bdf8;
    padding: 2px 5px;
    font-size: 10px;
    border: 1px solid #1e293b;
  }
  .logs-actions button:hover {
    background: #1e293b;
  }
  .logs-container {
    max-height: 110px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 10px;
    line-height: 1.4;
  }
  .log-row {
    padding: 2px 0;
    border-bottom: 1px solid #1e293b;
    word-break: break-all;
  }
  .log-time { color: #64748b; margin-right: 4px; }
  .log-tag.ok { color: #4ade80; font-weight: bold; }
  .log-tag.err { color: #f87171; font-weight: bold; }
  .log-tag.warn { color: #fbbf24; font-weight: bold; }
  .log-src { color: #94a3b8; font-size: 9px; }

  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 10px;
    color: #94a3b8;
  }
  .link-btn {
    background: none;
    border: none;
    color: #0284c7;
    padding: 0;
    font-size: 10px;
    cursor: pointer;
    text-decoration: underline;
  }
  .link-btn:hover { color: #0369a1; }
</style>
</head>
<body>
<div class="header">
  <div style="display: flex; align-items: center; gap: 8px;">
    <img src="icon-32.png" width="20" height="20" alt="eOfficeGate" style="border-radius: 4px;">
    <h3>eOfficeGate</h3>
  </div>
  <span id="versionBadge" class="badge">v1.3</span>
</div>
<p class="subtitle">Auto-fills CAPTCHA & keeps your session alive.</p>

<!-- Update Banner -->
<div id="updateBanner" class="update-banner" style="display: none;">
  <div class="update-header">
    <span class="update-title">🚀 Update Available: <b id="updateVersionBadge">v1.3.0</b></span>
  </div>
  <div class="update-actions">
    <button id="btn1ClickUpdate" class="btn-update-now">1-Click Update</button>
    <a id="btnChangelog" href="#" target="_blank" class="btn-changelog">Changelog</a>
  </div>
  <div id="updateProgress" class="update-progress" style="display: none;"></div>
</div>

<div class="card">
  <div class="card-title">Settings</div>
  <div class="row">
    <label><input id="autoCaptcha" type="checkbox"> Auto-fill Login CAPTCHA</label>
  </div>
  <div class="row">
    <label><input id="serverPing" type="checkbox"> Session Keep-Alive</label>
  </div>
  <div class="row" style="margin-top: 6px; border-top: 1px dashed #e2e8f0; padding-top: 5px;">
    <span>Heartbeat Interval</span>
    <select id="interval">
      <option value="1">1 minute</option>
      <option value="3" selected>3 minutes</option>
      <option value="5">5 minutes</option>
      <option value="10">10 minutes</option>
      <option value="15">15 minutes</option>
      <option value="30">30 minutes</option>
    </select>
  </div>
</div>

<div class="btn-group">
  <button id="toggle" class="stop">Stop Keep-Alive</button>
  <button id="testPing">Test Ping Now</button>
</div>

<div id="testStatus" class="test-result" style="display: none;"></div>

<div id="status" class="status-box">Checking eOffice tabs…</div>

<div class="logs-section">
  <div class="logs-header">
    <span id="logsTitle">Heartbeat Activity Logs</span>
    <div class="logs-actions">
      <button id="clearLogs">Clear</button>
      <button id="copyLogs">Copy</button>
    </div>
  </div>
  <div id="logsContainer" class="logs-container">
    <div style="color: #64748b; font-style: italic;">No logs yet. Waiting for heartbeat…</div>
  </div>
</div>

<div class="footer-bar">
  <span id="updateStatusText">Latest version checked</span>
  <button id="btnCheckUpdate" class="link-btn">Check for updates</button>
</div>

<script src="popup.js"></script>
</body>
</html>
