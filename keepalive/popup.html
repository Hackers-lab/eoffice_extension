<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>eOffice Activity Helper</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    width: 320px;
    padding: 14px;
    margin: 0;
    color: #333;
  }
  h3 { margin: 0 0 2px; font-size: 16px; color: #1e293b; }
  .subtitle { font-size: 11px; color: #64748b; margin: 0 0 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 13px; }
  select { width: 115px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; }
  
  .btn-group { display: flex; gap: 8px; margin-top: 10px; }
  button {
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button#toggle { flex: 2; color: #fff; }
  button#toggle.start { background: #16a34a; }
  button#toggle.start:hover { background: #15803d; }
  button#toggle.stop { background: #dc2626; }
  button#toggle.stop:hover { background: #b91c1c; }
  
  button#testPing {
    flex: 1.5;
    background: #0284c7;
    color: #fff;
  }
  button#testPing:hover { background: #0369a1; }
  button#testPing:disabled { background: #94a3b8; cursor: not-allowed; }

  .status {
    font-size: 11px;
    margin-top: 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 8px 10px;
    line-height: 1.5;
  }
  .status-line { margin: 2px 0; display: flex; align-items: flex-start; gap: 6px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .dot.ok { background: #16a34a; }
  .dot.warn { background: #ea580c; }
  .dot.err { background: #dc2626; }
  .dot.idle { background: #94a3b8; }
  
  .test-result {
    margin-top: 6px;
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }
  .test-result.success { background: #dcfce7; color: #166534; }
  .test-result.error { background: #fee2e2; color: #991b1b; }

  .note { font-size: 10px; color: #94a3b8; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
<h3>eOffice Activity Helper</h3>
<p class="subtitle">Keeps eOffice session alive without page reload.</p>

<div class="row">
  <label for="interval">Heartbeat Interval</label>
  <select id="interval">
    <option value="1">1 minute</option>
    <option value="3">3 minutes</option>
    <option value="5">5 minutes</option>
    <option value="10">10 minutes</option>
    <option value="15">15 minutes</option>
    <option value="30">30 minutes</option>
  </select>
</div>

<div class="row">
  <label><input id="serverPing" type="checkbox"> Server keepalive (/efile-api/date)</label>
</div>

<div class="row">
  <label><input id="subtleActivity" type="checkbox"> Simulated mouse/scroll</label>
</div>

<div class="btn-group">
  <button id="toggle">Start</button>
  <button id="testPing">Test Ping Now</button>
</div>

<div id="testStatus" class="test-result" style="display: none;"></div>

<div id="status" class="status">Checking tab status…</div>

<p class="note">Heartbeat uses your existing session cookies to refresh the server idle timer. Never reloads page or touches forms.</p>

<script src="popup.js"></script>
</body>
</html>
